# Continuous integration (spec §4.4, §17.3).
#
# Jobs: `static` (lint/format/types/audit/licenses), `test` (unit,
# integration, component, E2E) and `build`. The final gate job is named
# `CI` to match the required status check configured on `master` (task 004):
# it runs after every other job, fails if any of them failed, and is the
# single check that blocks pull requests.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check server and UI
        run: npm run typecheck:all

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check dependency licenses
        run: npm run license:check

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-reports
          path: reports/
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Spec §4.4/§17.2: cover Node.js 22 including the declared minimum
      # (22.13.0, required for flagless node:sqlite) and Node.js 24, which is
      # the current LTS line since October 2026. When the next LTS ships, add
      # it here.
      matrix:
        node: ["22.13.0", "22", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit, integration, and component tests
        run: npm run test:ci

      - name: Set up Playwright browser
        if: matrix.node == '22'
        run: npx playwright install --with-deps chromium

      - name: Build the UI for E2E
        if: matrix.node == '22'
        run: npm run build:ui

      - name: Run E2E tests
        if: matrix.node == '22'
        run: npm run test:e2e

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.node }}
          path: |
            reports/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ui

      - name: Verify build artifacts
        run: npm run verify:build

  # Clean-distribution installation containers (spec §4.4, §17.2): Ubuntu
  # 22.04, Ubuntu 24.04, and Debian stable, each with the pinned minimum
  # Node.js runtime installed from the official binaries. The jobs verify
  # the declared minimum runtime on the target distributions and install
  # the packed tarball globally without a source checkout (task 053).
  install:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["ubuntu:22.04", "ubuntu:24.04", "debian:stable"]
    container: ${{ matrix.container }}
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils

      - name: Install Node.js 22.13.0 from official binaries
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=x64 ;;
            aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/v22.13.0/node-v22.13.0-linux-${arch}.tar.xz" -o /tmp/node.tar.xz
          mkdir -p /usr/local/lib/nodejs
          tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
          for bin in node npm npx; do
            ln -sf "/usr/local/lib/nodejs/node-v22.13.0-linux-${arch}/bin/$bin" "/usr/local/bin/$bin"
          done

      - name: Verify the declared minimum runtime
        run: |
          test "$(node -v)" = "v22.13.0"
          node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.close()"

      - name: Download the packed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-tarball

      - name: Install the package globally from the tarball
        run: npm install --global ./quotameter-*.tgz

      - name: Invoke the installed CLI
        run: |
          tarball="$(basename "$(pwd)"/quotameter-*.tgz)"
          expected="${tarball#quotameter-}"; expected="${expected%.tgz}"
          version="$(quotameter --version)"
          echo "quotameter --version -> $version (expected $expected)"
          test "$version" = "$expected"

  # Package content check (task 052): the tarball must contain exactly the
  # allowlisted files. The job is consumed by install smoke tests (task 053).
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tarball contents against the allowlist
        run: npm run check:package

      - name: Pack the tarball for smoke tests
        run: npm pack

      - name: Upload the tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tarball
          path: quotameter-*.tgz
          retention-days: 7
          if-no-files-found: error

  # Unsupported runtime behavior (task 054): a Node.js below the declared
  # minimum must fail with an actionable message naming the required version.
  unsupported-node:
    needs: package
    runs-on: ubuntu-latest
    container: node:20-bookworm-slim
    steps:
      - name: Download the packed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-tarball

      - name: Install the package globally from the tarball
        run: npm install --global ./quotameter-*.tgz

      - name: Expect a clear version error from the CLI
        run: |
          set +e
          output="$(quotameter --version 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::CLI unexpectedly succeeded on Node $(node -v)"
            exit 1
          fi
          echo "$output" | grep -F "22.13.0" >/dev/null || {
            echo "::error::Error message does not name the required Node.js version"
            exit 1
          }

  # Required gate: keeps the protected-branch configuration stable (the
  # required check is exactly `CI`) while the pipeline grows behind it.
  CI:
    name: CI
    needs: [static, test, build, install, package, unsupported-node]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
