# Continuous integration (spec §4.4, §17.3).
#
# Jobs: `static` (lint/format/types/audit/licenses), `test` (unit,
# integration, component, E2E), `timezone` (the §17.1 time-zone regression
# matrix) and `build`. The final gate job is named `CI` to match the
# required status check configured on `master` (task 004): it runs after
# every other job, fails if any of them failed, and is the single check
# that blocks pull requests.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check server and UI
        run: npm run typecheck:all

      # The npm bundled with Node 22 (10.9.x) lost `npm audit` when the
      # registry retired the quick-audit endpoint (2026-10-30); npm 11 uses
      # the bulk advisory endpoint. Keep the pin in sync with the Dockerfile.
      - name: Update npm for the bulk audit endpoint
        run: npm install -g npm@11.9.0

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check dependency licenses
        run: npm run license:check

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-reports
          path: reports/
          retention-days: 30

  # The vitest projects pin systemd-less behavior through the real launcher
  # (§5.3/§5.2 fallback arms — D-103's "the CI images ship no systemd"
  # premise, D-160's environment note): ubuntu-latest moved to 26.04, whose
  # job sessions run a LIVE systemd user manager — there `quotameter service
  # install` really installs into the passwd home and enables the unit (the
  # 2026-11 CI breakage: cross-test contamination plus live systemctl
  # answers). The test jobs are pinned to the systemd-less 24.04 image;
  # re-pointing them at a newer image requires re-working those suites'
  # environment premises first (see DECISIONS.md D-160).
  test:
    # Job container (D-160's successor correction): EVERY hosted runner
    # image ships a live user systemd since the ubuntu-26.04 image
    # migration — the pinned ubuntu-24.04 included — which both breaks
    # the systemd-less outcome pins of the CLI seam suites and lets
    # earlier tests write real user units into the runner's passwd home
    # for later ones to trip over. The node image restores the
    # deterministic systemd-less class per job: a clean root HOME, no
    # systemd, no cross-test state — exactly the seam-design premise
    # (D-103) the suite's outcome pins assume. The image tag carries the
    # matrix's Node version; no setup-node is needed inside the container.
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}
    strategy:
      fail-fast: false
      # Spec §4.4/§17.2: cover Node.js 22 including the declared minimum
      # (22.13.0, required for flagless node:sqlite) and Node.js 24, which is
      # the current LTS line since October 2026. When the next LTS ships, add
      # it here.
      matrix:
        node: ['22.13.0', '22', '24']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run unit, integration, and component tests
        # Non-root execution: the permission-refusal arms (§6.3's 0700/0600
        # enforcement, EACCES paths) are meaningless for root, which
        # bypasses file modes — but the job container itself must stay
        # root for the runner's /__w plumbing (state files, checkout).
        # setpriv drops to the image's node user without PAM; the chown
        # makes the workspace (node_modules, reports, coverage) writable
        # for it.
        run: |
          chown -R node:node "$GITHUB_WORKSPACE"
          setpriv --reuid=node --regid=node --init-groups \
            env HOME=/home/node npm run test:ci

      - name: Set up Playwright browser
        if: matrix.node == '22'
        run: npx playwright install --with-deps chromium

      - name: Build the UI for E2E
        if: matrix.node == '22'
        run: npm run build:ui

      - name: Run E2E tests
        if: matrix.node == '22'
        run: npm run test:e2e

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.node }}
          path: |
            reports/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # Time-zone regression matrix (task 126, spec §17.1, decision D-097): the
  # time/peak-hours suite (`npm run test:time`) runs once per process `TZ`,
  # covering DST and non-DST offsets at whole-, half-, and quarter-hour
  # granularity — the seven §17.1-required identifiers as process `TZ`
  # values plus Asia/Kathmandu (never-DST quarter-hour) and
  # Pacific/Kiritimati (+14:00 dateline edge). Node is pinned to the
  # declared minimum so scripts/verify-tz.mjs's zone-facts table (generated
  # from that runtime's ICU) stays a genuine oracle; the runtime dimension
  # already belongs to the `test` job's matrix. Keep the zone list in sync
  # with scripts/verify-tz.mjs — membership is pinned by
  # test/integration/tz-verify-script.spec.ts.
  timezone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - America/New_York
          - Europe/London
          - Asia/Shanghai
          - Asia/Kolkata
          - Asia/Kathmandu
          - Australia/Lord_Howe
          - Pacific/Chatham
          - Pacific/Kiritimati
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the runner's time-zone facts
        run: node scripts/verify-tz.mjs

      - name: Run the time/peak-hours suite
        run: npm run test:time

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ui

      - name: Verify build artifacts
        run: npm run verify:build

  # Clean-distribution installation containers (spec §4.4, §17.2): Ubuntu
  # 22.04, Ubuntu 24.04, and Debian stable, each with the pinned minimum
  # Node.js runtime installed from the official binaries. The jobs verify
  # the declared minimum runtime on the target distributions and install
  # the packed tarball globally without a source checkout (task 053).
  install:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:stable']
    container: ${{ matrix.container }}
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils

      - name: Install Node.js 22.13.0 from official binaries
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=x64 ;;
            aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/v22.13.0/node-v22.13.0-linux-${arch}.tar.xz" -o /tmp/node.tar.xz
          mkdir -p /usr/local/lib/nodejs
          tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
          for bin in node npm npx; do
            ln -sf "/usr/local/lib/nodejs/node-v22.13.0-linux-${arch}/bin/$bin" "/usr/local/bin/$bin"
          done

      - name: Verify the declared minimum runtime
        run: |
          test "$(node -v)" = "v22.13.0"
          node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.close()"

      - name: Download the packed tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball

      - name: Install the package globally from the tarball
        # --prefix /usr/local keeps the binary on PATH: the container's Node
        # lives in its own prefix (/usr/local/lib/nodejs/...) whose bin
        # directory is not on PATH.
        run: npm install --global --prefix /usr/local ./quotameter-*.tgz

      - name: Invoke the installed CLI
        run: |
          tarball="$(basename "$(pwd)"/quotameter-*.tgz)"
          expected="${tarball#quotameter-}"; expected="${expected%.tgz}"
          version="$(quotameter --version)"
          echo "quotameter --version -> $version (expected $expected)"
          test "$version" = "$expected"

  # Package content check (task 052): the tarball must contain exactly the
  # allowlisted files. The job is consumed by install smoke tests (task 053).
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tarball contents against the allowlist
        run: npm run check:package

      - name: Pack the tarball for smoke tests
        run: npm pack

      - name: Upload the tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: quotameter-*.tgz
          retention-days: 7
          if-no-files-found: error

  # Unsupported runtime behavior (task 054): a Node.js below the declared
  # minimum must fail with an actionable message naming the required version.
  unsupported-node:
    needs: package
    runs-on: ubuntu-latest
    container: node:20-bookworm-slim
    steps:
      - name: Download the packed tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball

      - name: Install the package globally from the tarball
        run: npm install --global ./quotameter-*.tgz

      - name: Expect a clear version error from the CLI
        run: |
          set +e
          output="$(quotameter --version 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::CLI unexpectedly succeeded on Node $(node -v)"
            exit 1
          fi
          echo "$output" | grep -F "22.13.0" >/dev/null || {
            echo "::error::Error message does not name the required Node.js version"
            exit 1
          }

  # Mutation testing moved to the daily scheduled workflow
  # (.github/workflows/mutation.yml) with issue-based triage — see
  # DECISIONS.md D-045. It no longer gates pushes.

  # Required gate: keeps the protected-branch configuration stable (the
  # required check is exactly `CI`) while the pipeline grows behind it.
  CI:
    name: CI
    needs: [static, test, timezone, build, install, package, unsupported-node]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
