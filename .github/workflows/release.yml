# Release workflow (spec §4.4, task 058).
#
# Publishes to npm only from a pushed vX.Y.Z tag, using npm trusted
# publishing (OIDC) with provenance attestations. There are no long-lived
# publish tokens in this repository: the only elevated permission is the
# workflow-scoped id-token. One-time linking of this repository/workflow to
# the npm package is documented in docs/release.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # npm trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Recommended protected environment on GitHub; enable it and add the
    # npm registry as a deployment target when configuring trusted publishing.
    # environment: npm
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Check tarball contents against the allowlist
        run: npm run check:package

      - name: Remove the private marker for release
        run: npm pkg delete private

      - name: Publish with provenance
        run: npm publish --provenance --access public
