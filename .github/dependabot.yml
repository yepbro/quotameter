# Dependabot dependency updates (spec §4.4, task 056).
#
# npm packages and GitHub Actions are checked weekly on Monday. Update PRs
# follow the project conventions (Conventional Commits, English) and must
# pass the required CI check like any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
    ignore:
      # TypeScript 7.0 (native compiler, 2026-07) ships without the programmatic
      # API that typescript-eslint and vue-tsc/Volar embed: `npm ci` fails ERESOLVE
      # on the typescript-eslint peer ">=4.8.4 <6.1.0" (PR #9, closed 2026-11-05).
      # Hold the 6.x line — major bumps are ignored (7.1 would open red PRs until
      # typescript-eslint supports the 7.x API, typescript-eslint#10940); 6.x
      # minor/patch bumps stay enabled. Drop this rule when we migrate to 7.1+.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
