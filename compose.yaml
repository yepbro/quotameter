# Development environment for Quotameter.
#
# `docker compose run --rm dev` starts an interactive development shell with a
# predictable working directory. See README.md ("Development environment") for
# the full command surface.
name: quotameter

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    # Keep the container alive so `docker compose exec` / `run` can be used
    # for repeat commands without restarting the environment.
    command: ["sleep", "infinity"]
    environment:
      # Development data lives outside the bind-mounted source tree so that
      # secrets, SQLite databases, and logs never appear in tracked
      # directories (spec §6, §11). Override per environment via .env.
      QUOTAMETER_CONFIG_DIR: ${QUOTAMETER_CONFIG_DIR:-/var/lib/quotameter/config}
      QUOTAMETER_DATA_DIR: ${QUOTAMETER_DATA_DIR:-/var/lib/quotameter/data}
      # Coverage reports stay inside the data volume to avoid ownership
      # conflicts with host-generated reports on the bind mount.
      COVERAGE_DIR: /var/lib/quotameter/coverage
    volumes:
      # Live-editable source tree; changes are visible immediately without
      # rebuilding the image.
      - .:/app
      # Shadow the host node_modules with a container-local named volume so
      # host and container dependency trees never conflict (different Node
      # versions, native modules, and platforms).
      - node_modules:/app/node_modules
      # Persist package caches (npm, Playwright browsers) between rebuilds.
      - dev-cache:/home/node/.cache
      # Isolated development data: configuration, SQLite databases, logs, and
      # temporary test output. Removable without touching source or caches.
      - dev-data:/var/lib/quotameter

volumes:
  node_modules:
  dev-cache:
  dev-data:
